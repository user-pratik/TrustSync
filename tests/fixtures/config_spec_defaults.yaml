# Video stream parameters
video:
  fps: 30
  width: 640
  height: 480
  camera_index: 0
  max_faces: 4

# Audio stream parameters
audio:
  sample_rate: 16000
  env_hz: 100
  device: null
  latency_s: 0.0
  ring_s: 10.0

# Voice Activity Detection
vad:
  calib_s: 1.0
  on_factor: 3.0
  min_abs: 0.004
  hangover_s: 0.30
  adapt: 0.005

# Utterance segmentation
utterance:
  min_s: 0.40
  max_s: 4.0
  pad_s: 0.25

# Face tracking
tracker:
  max_dist: 0.15
  max_missed: 15

# Lip buffer
lip:
  buffer_s: 6.0

# Audiovisual synchrony
sync:
  window_s: 1.5
  min_window_s: 0.6
  max_lag_s: 0.20
  min_lip_std: 0.004
  env_eps: 0.0001

# Face image quality
quality:
  min_face_px: 80
  min_brightness: 40
  max_edge_frac: 0.05

# Addressee classification
addressee:
  max_yaw_deg: 25.0
  max_pitch_deg: 20.0
  yaw_offset_deg: 0.0
  pitch_offset_deg: 0.0
  gaze_weight: 0.3
  gaze_max_off: 0.6
  use_gaze: true

# Fusion decision gate
gate:
  mode: rule
  min_sync: 0.35
  min_margin: 0.10
  min_directed: 0.5
  min_quality: 0.5
  model_path: models/gate.joblib

# HTTP and WebSocket server
server:
  host: 127.0.0.1
  port: 8000
  ws_hz: 20
  jpeg_quality: 80
