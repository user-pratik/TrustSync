[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "trustsync"
version = "0.1.0"
requires-python = ">=3.10,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "hardware: needs a camera or microphone",
]
